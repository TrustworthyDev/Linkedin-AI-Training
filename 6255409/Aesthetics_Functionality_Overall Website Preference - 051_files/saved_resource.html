  <title>iPhone 11 Pro | A Closer Look</title>
  <style>
    :root {

    .wallpaper::before, .wallpaper::after {

    .back::before {

    .edge-top { top: -10px; }

    .viewer-toolbar {

    .spin-control .play-icon { display: none; }
    .spin-control.is-paused .pause-icon { display: none; }
    .spin-control.is-paused .play-icon { display: block; fill: currentColor; stroke: none; }

    @keyframes rise-in {

    @media (prefers-reduced-motion: reduce) {

    }
  </style>

          <div class="finish-selector">

              <button class="swatch" type="button" data-finish="gray" aria-label="Space Gray" aria-pressed="false" title="Space Gray" style="--swatch: #777b7d"><span></span></button>
              <button class="swatch" type="button" data-finish="silver" aria-label="Silver" aria-pressed="false" title="Silver" style="--swatch: #d7dad4"><span></span></button>
              <button class="swatch" type="button" data-finish="gold" aria-label="Gold" aria-pressed="false" title="Gold" style="--swatch: #d5bdae"><span></span></button>
            </div>

      <section class="viewer" aria-label="Interactive iPhone 11 Pro viewer">
        <div class="viewer-aura" aria-hidden="true"></div>

              <div class="edge edge-top"></div>
              <div class="edge edge-bottom"><span class="speaker-holes left"></span><span class="port"></span><span class="speaker-holes right"></span></div>

              <div class="face front">

                  <div class="screen-time"><small>Tuesday, September 10</small><strong>9:41</strong></div>

                  <span class="home-indicator"></span>

              <div class="face back">

                  <span class="lens lens-one"></span><span class="lens lens-two"></span><span class="lens lens-three"></span>
                  <span class="flash"></span><span class="microphone"></span>
                </div>
                <svg class="back-logo" viewBox="0 0 60 68" aria-hidden="true"><path d="M49.1 35.6c0-8 6.5-11.8 6.8-12-3.7-5.5-9.4-6.2-11.4-6.3-4.9-.5-9.7 2.9-12.2 2.9-2.5 0-6.3-2.8-10.5-2.7-5.4.1-10.4 3.1-13.2 7.8-5.6 9.5-1.4 23.5 4 31.2 2.7 3.8 5.8 8.1 10 7.9 4-.2 5.5-2.6 10.3-2.6 4.8 0 6.1 2.6 10.4 2.5 4.3-.1 7.1-3.8 9.8-7.7 3.1-4.4 4.3-8.6 4.4-8.8-.1 0-8.4-3.2-8.5-12.7zM41.5 11.9c2.3-2.8 3.8-6.7 3.4-10.6-3.3.1-7.3 2.2-9.7 5-2.1 2.5-4 6.5-3.5 10.2 3.7.3 7.4-1.9 9.8-4.6z"></path></svg>
                <span class="back-word">iPhone</span>
              </div>
            </div>
          </div>

        <div class="viewer-toolbar">
          <div class="drag-cue" aria-hidden="true">
            <svg viewBox="0 0 32 24"><path d="M5 9c3-3.5 7-5.5 11-5.5s8 2 11 5.5M5 9V4m0 5h5M27 15c-3 3.5-7 5.5-11 5.5S8 18.5 5 15m22 0v5m0-5h-5"></path></svg>

          </div>
          <div class="toolbar-actions" aria-label="View controls">

            <button class="text-action is-selected" id="back-button" type="button" aria-pressed="true">Back</button>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <button class="spin-control" id="spin-button" type="button" aria-label="Pause automatic rotation" aria-pressed="true" title="Pause automatic rotation">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="pause-icon" d="M8 5v14m8-14v14"></path><path class="play-icon" d="M8 4.5v15l12-7.5z"></path></svg>
            </button>
          </div>

    </main>
  </div>

  <script>
    const finishes = {
      green: {
        name: 'Midnight Green', body: '#687c6d', light: '#a3b4a3', dark: '#33493b', rim: '#8da18e',
        side: '#69816f', sideLight: '#b2c2af', sideDark: '#2c4435', camera: '#748978', logo: '#b4c3b1', glow: '81, 136, 99'
      },
      gray: {
        name: 'Space Gray', body: '#73777b', light: '#b3b7b8', dark: '#363b40', rim: '#9ba1a3',
        side: '#777c80', sideLight: '#c3c6c5', sideDark: '#373d42', camera: '#858a8d', logo: '#c4c8c6', glow: '108, 121, 128'
      },
      silver: {
        name: 'Silver', body: '#d1d7d1', light: '#f5f7ef', dark: '#a4ada6', rim: '#dce2db',
        side: '#d4dad5', sideLight: '#fcfcf6', sideDark: '#929d96', camera: '#c8d0c8', logo: '#8e9b91', glow: '160, 184, 169'
      },
      gold: {
        name: 'Gold', body: '#cdb7a6', light: '#f2dcca', dark: '#9b7c6c', rim: '#ddc6b4',
        side: '#d3baa8', sideLight: '#f7e5d3', sideDark: '#876b5d', camera: '#d4bdac', logo: '#f0ddca', glow: '179, 126, 99'
      }
    };

    const root = document.documentElement;
    const phone = document.getElementById('phone');
    const stage = document.getElementById('stage');
    const spinButton = document.getElementById('spin-button');
    const frontButton = document.getElementById('front-button');
    const backButton = document.getElementById('back-button');
    const swatches = [...document.querySelectorAll('.swatch')];
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    let yaw = 151;
    let pitch = -8;
    let targetYaw = null;
    let dragging = false;
    let playing = !reducedMotion.matches;
    let lastTime = 0;
    let lastX = 0;
    let lastY = 0;
    let visibleSide = 'back';

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function updateSpinButton() {
      const label = playing ? 'Pause automatic rotation' : 'Play automatic rotation';
      spinButton.classList.toggle('is-paused', !playing);
      spinButton.setAttribute('aria-label', label);
      spinButton.setAttribute('aria-pressed', String(playing));
      spinButton.title = label;
    }

    function renderPhone() {
      phone.style.transform = `rotateX(${pitch}deg) rotateY(${yaw}deg)`;
      const angle = ((yaw % 360) + 360) % 360;
      const nextSide = angle > 90 && angle < 270 ? 'back' : 'front';
      if (nextSide !== visibleSide) {
        visibleSide = nextSide;
        frontButton.classList.toggle('is-selected', nextSide === 'front');
        backButton.classList.toggle('is-selected', nextSide === 'back');
        frontButton.setAttribute('aria-pressed', String(nextSide === 'front'));
        backButton.setAttribute('aria-pressed', String(nextSide === 'back'));
      }
    }

    function moveToView(degrees) {
      playing = false;
      targetYaw = degrees + Math.round((yaw - degrees) / 360) * 360;
      updateSpinButton();
    }

    function setFinish(key) {
      const finish = finishes[key];
      if (!finish) return;
      const variables = {
        '--body': finish.body, '--body-light': finish.light, '--body-dark': finish.dark,
        '--rim': finish.rim, '--side': finish.side, '--side-light': finish.sideLight,
        '--side-dark': finish.sideDark, '--camera': finish.camera, '--logo': finish.logo,
        '--glow-rgb': finish.glow
      };
      for (const [name, value] of Object.entries(variables)) root.style.setProperty(name, value);
      document.getElementById('finish-name').textContent = finish.name;
      swatches.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.finish === key)));
      moveToView(180);
    }

    swatches.forEach(button => button.addEventListener('click', () => setFinish(button.dataset.finish)));
    frontButton.addEventListener('click', () => moveToView(0));
    backButton.addEventListener('click', () => moveToView(180));

    spinButton.addEventListener('click', () => {
      playing = !playing;
      targetYaw = null;
      updateSpinButton();
    });

    stage.addEventListener('pointerdown', event => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      dragging = true;
      playing = false;
      targetYaw = null;
      lastX = event.clientX;
      lastY = event.clientY;
      stage.setPointerCapture(event.pointerId);
      stage.classList.add('is-dragging');
      updateSpinButton();
    });

    stage.addEventListener('pointermove', event => {
      if (!dragging) return;
      yaw += (event.clientX - lastX) * 0.65;
      pitch = clamp(pitch - (event.clientY - lastY) * 0.3, -25, 25);
      lastX = event.clientX;
      lastY = event.clientY;
      renderPhone();
    });

    function endDrag() {
      dragging = false;
      stage.classList.remove('is-dragging');
    }

    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);
    stage.addEventListener('lostpointercapture', endDrag);

    stage.addEventListener('keydown', event => {
      if (event.code === 'Space') {
        event.preventDefault();
        playing = !playing;
        targetYaw = null;
        updateSpinButton();
        return;
      }
      if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home'].includes(event.key)) return;
      event.preventDefault();
      playing = false;
      targetYaw = null;
      if (event.key === 'ArrowLeft') yaw -= event.shiftKey ? 30 : 12;
      if (event.key === 'ArrowRight') yaw += event.shiftKey ? 30 : 12;
      if (event.key === 'ArrowUp') pitch = clamp(pitch + 8, -25, 25);
      if (event.key === 'ArrowDown') pitch = clamp(pitch - 8, -25, 25);
      if (event.key === 'Home') { yaw = 151; pitch = -8; }
      updateSpinButton();
      renderPhone();
    });

    reducedMotion.addEventListener('change', event => {
      if (event.matches) {
        playing = false;
        updateSpinButton();
      }
    });

    function animate(time) {
      const elapsed = Math.min(time - (lastTime || time), 45);
      lastTime = time;
      let changed = false;
      if (!dragging && targetYaw !== null) {
        yaw += (targetYaw - yaw) * Math.min(1, elapsed * 0.012);
        pitch += (-8 - pitch) * Math.min(1, elapsed * 0.012);
        if (Math.abs(targetYaw - yaw) < 0.08) { yaw = targetYaw; targetYaw = null; }
        changed = true;
      } else if (!dragging && playing) {
        yaw += elapsed * 0.021;
        if (yaw > 7200) yaw %= 360;
        changed = true;
      }
      if (changed) renderPhone();
      requestAnimationFrame(animate);
    }

    updateSpinButton();
    renderPhone();
    requestAnimationFrame(animate);
  </script>
