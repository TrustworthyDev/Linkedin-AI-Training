            <path d="M275 640H525L543 659 529 696H271L257 659Z" fill="url(#plate-rim)" stroke="#031128" stroke-width="6"></path>
            <path d="M282 648H518L533 662 523 687H277L267 662Z" fill="#0b2444"></path>
            <path d="M282 648H518" stroke="#99d8f4" stroke-width="1.5"></path>
            <path d="M280 668H301M499 668H520" stroke="#5eb5df" stroke-width="2"></path>
            <use href="#word-season" transform="translate(317.7625 657.5) scale(.225 .2)" fill="#d8f4ff"></use>
          </g>
        </g>
      </svg>
    </main>

    <footer class="toolbar" aria-label="Logo preview and download controls">
      <div class="backgrounds" role="group" aria-label="Preview background. Downloads always have a transparent background.">
        <button class="background-button" type="button" data-background="dark" aria-label="Dark preview" aria-pressed="true" title="Dark preview">
          <span class="swatch swatch--dark" aria-hidden="true"></span>
        </button>
        <button class="background-button" type="button" data-background="light" aria-label="Light preview" aria-pressed="false" title="Light preview">
          <span class="swatch swatch--light" aria-hidden="true"></span>
        </button>
        <button class="background-button" type="button" data-background="transparent" aria-label="Transparency preview" aria-pressed="false" title="Transparency preview">
          <span class="swatch swatch--transparent" aria-hidden="true"></span>
        </button>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <div class="format">
        <label for="format" class="sr-only">Download format and resolution</label>
        <select id="format">
          <option value="svg">SVG</option>
          <option value="png-1024">PNG 1K</option>
          <option value="png-2048">PNG 2K</option>
          <option value="png-4096">PNG 4K</option>
        </select>
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 4.5 3 3 3-3"></path></svg>
      </div>
      <button class="download-button" id="download" type="button" aria-label="Download transparent SVG">
        <svg class="download-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v10m-3.5-3.5L10 12l3.5-3.5M3 13v4h14v-4"></path></svg>
        <svg class="spinner" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10" cy="10" r="7" opacity=".2"></circle><path d="M10 3a7 7 0 0 1 7 7" stroke-linecap="round"></path></svg>
        <span class="download-label">Download</span>
      </button>
    </footer>
    <p class="status" id="status" role="status" aria-live="polite" aria-atomic="true"></p>
  </div>

  <script>
    (() => {
      'use strict';

      const app = document.getElementById('app');
      const crest = document.getElementById('crest');
      const backgroundButtons = [...document.querySelectorAll('.background-button')];
      const format = document.getElementById('format');
      const downloadButton = document.getElementById('download');
      const downloadLabel = downloadButton.querySelector('.download-label');
      const fullscreenButton = document.getElementById('fullscreen');
      const status = document.getElementById('status');
      let statusTimer;
      let labelTimer;

      const preferences = {
        get(key) {
          try { return localStorage.getItem('undergod-' + key); }
          catch { return null; }
        },
        set(key, value) {
          try { localStorage.setItem('undergod-' + key, value); }
          catch { /* The preview still works when browser storage is unavailable. */ }
        }
      };

      function showStatus(message) {
        clearTimeout(statusTimer);
        status.textContent = message;
        status.classList.add('is-visible');
        statusTimer = setTimeout(() => status.classList.remove('is-visible'), 4200);
      }

      function setBackground(value) {
        if (!['dark', 'light', 'transparent'].includes(value)) return;
        app.dataset.background = value;
        backgroundButtons.forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.background === value));
        });
        preferences.set('background', value);
      }

      backgroundButtons.forEach(button => {
        button.addEventListener('click', () => setBackground(button.dataset.background));
      });
      setBackground(preferences.get('background') || 'dark');

      function updateFormat() {
        const description = format.value === 'svg'
          ? 'SVG'
          : format.value.split('-')[1] + '-pixel PNG';
        downloadButton.setAttribute('aria-label', 'Download transparent ' + description);
        preferences.set('format', format.value);
      }

      const savedFormat = preferences.get('format');
      if ([...format.options].some(option => option.value === savedFormat)) format.value = savedFormat;
      format.addEventListener('change', updateFormat);
      updateFormat();

      function serializeCrest() {
        const copy = crest.cloneNode(true);
        copy.removeAttribute('class');
        copy.removeAttribute('id');
        copy.setAttribute('width', '800');
        copy.setAttribute('height', '880');
        copy.querySelectorAll('[class]').forEach(element => element.removeAttribute('class'));
        return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(copy);
      }

      function saveBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      }

      async function renderPng(svgSource, width) {
        const svgUrl = URL.createObjectURL(new Blob([svgSource], { type: 'image/svg+xml;charset=utf-8' }));
        try {
          const image = new Image();
          await new Promise((resolve, reject) => {
            image.onload = resolve;
            image.onerror = () => reject(new Error('The vector artwork could not be rendered.'));
            image.src = svgUrl;
          });

          // Do not paint the canvas background: all PNG exports retain alpha transparency.
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = Math.round(width * 880 / 800);
          const context = canvas.getContext('2d');
          if (!context) throw new Error('Canvas is not available in this browser.');
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          return await new Promise((resolve, reject) => {
            canvas.toBlob(blob => {
              if (blob) resolve(blob);
              else reject(new Error('The PNG could not be created at this resolution.'));
            }, 'image/png');
          });
        } finally {
          URL.revokeObjectURL(svgUrl);
        }
      }

      downloadButton.addEventListener('click', async () => {
        if (downloadButton.disabled) return;
        clearTimeout(labelTimer);
        const selectedFormat = format.value;
        downloadButton.disabled = true;
        downloadButton.setAttribute('aria-busy', 'true');
        downloadButton.classList.add('is-exporting');
        downloadLabel.textContent = 'Preparing';
        format.disabled = true;

        try {
          const source = serializeCrest();
          const basename = 'undergod-conquest-season-1';
          if (selectedFormat === 'svg') {
            saveBlob(new Blob([source], { type: 'image/svg+xml;charset=utf-8' }), basename + '.svg');
            showStatus('SVG ready. Scalable artwork, transparent background.');
          } else {
            const width = Number(selectedFormat.split('-')[1]);
            const png = await renderPng(source, width);
            saveBlob(png, basename + '-' + width + 'px.png');
            showStatus(width + ' px PNG ready. Transparent background included.');
          }
          downloadLabel.textContent = 'Ready';
        } catch (error) {
          console.error('Logo export failed:', error);
          downloadLabel.textContent = 'Try again';
          showStatus('Export could not finish. Try SVG or a smaller PNG.');
        } finally {
          downloadButton.disabled = false;
          downloadButton.removeAttribute('aria-busy');
          downloadButton.classList.remove('is-exporting');
          format.disabled = false;
          labelTimer = setTimeout(() => { downloadLabel.textContent = 'Download'; }, 2400);
        }
      });

      if (!document.fullscreenEnabled) fullscreenButton.hidden = true;
      fullscreenButton.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch {
          showStatus('Fullscreen is not available in this browser view.');
        }
      });
      document.addEventListener('fullscreenchange', () => {
        const active = Boolean(document.fullscreenElement);
        app.classList.toggle('is-fullscreen', active);
        fullscreenButton.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
        fullscreenButton.title = active ? 'Exit fullscreen' : 'Enter fullscreen';
      });
    })();
  </script>


</body></html>
